[package]
name = "ytmusic-lite"
version = "1.0.3"
edition = "2021"
build = "build.rs"

[dependencies]
libloading = "0.8"
serde_json = "1"
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tray-icon = { version = "0.21", default-features = false }
souvlaki = { version = "0.8", default-features = false }
wry = { version = "0.54", default-features = false, features = ["os-webview"] }
arboard = { version = "3", default-features = false }
webbrowser = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "raw-window-handle-06",
] }

[build-dependencies]
slint-build = "1"
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
